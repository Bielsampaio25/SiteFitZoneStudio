<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/recuperarSenha.css">
    <title>Recuperar Senha</title>
</head>

<body>

    <main class="recuperar-container">

        <section class="recuperar-card">

            <img src="../assets/images/imagem_logo.png" alt="FitZone Studio" class="logo">

            <h1>Recupere sua senha</h1>

            <p class="descricao">
                Digite o e-mail cadastrado na sua conta.
                Enviaremos um link para você criar uma nova senha.
            </p>

            <form action="/recuperarSenha" method="post" class="formulario">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <button type="submit" class="btn-recuperar">
                    Enviar link de recuperação
                </button>

            </form>

            <a href="../../index.html" class="voltar">
                Voltar para o login
            </a>

        </section>

    </main>

</body>

</html>
