<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css//cadastrarEvento.css">
    <title>Cadastro Funcionario</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <img src="../assets/images/imagem_logo.png" alt="" class="logo">
            <div class="perfil">
                <img src="../assets/images/Ellipse 1.png" alt="">
                <div class="perfil-texto">
                    <h1>Carlos Santana</h1>
                    <h2>Administrador</h2>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <aside class="sidebar">
            <div class="sidebar-content">
                <ul>
                    <li><a href="../pages/dashboardAdmin.html">Dashboard</a></li>
                    <li><a href="../pages/funcionariosAdmin.html">Funcionarios</a></li>
                    <li><a href="../pages/alunosAdmin.html">Alunos</a></li>
                    <li><a href="../pages/financeiroAdmin.html">Financeiro</a></li>
                    <li id="agenda"><a href="../pages/agendaAdmin.html">Agenda</a></li>
                    <li><a href="../index.html">Sair</a></li>
                </ul>
            </div>
        </aside>
        <form action="/cadastarFuncionario" method="post" class="formulario">
            <h1>Cadastrar Evento</h1>
            <div class="formulario-content">
                    <div class="campo">
                        <label for="modalidade">Modalidade</label>
                        <input type="text" name="modalidade" id="cpf" placeholder="Digite a modalidade da aula ex: (natação, crosfit, etc...)">
                    </div>
                    <div class="campo">
                        <label for="horario">Data de Nascimento</label>
                        <input type="time" name="horario" id="horario">
                    </div>
                    <div class="campo">
                        <label for="instrutor">Instrutor</label>
                        <input type="text" name="instrutor" id="instrutor" placeholder="Digite o nome do instrutor">
                    </div>
                    <div class="campo">
                        <label for="dia">Dia</label>
                        <input type="date" name="dia" id="dia">
                    </div>
            </div>
            <div class="botoes">
                <div class="btnCancelar">
                    <a href="../pages/agendaAdmin.html">Cancelar</a>
                </div>
                <div class="btnCadastro">
                    <button type="button"
                        onclick="verificarInput(), verificarCpf(), verificarSelect()">Cadastrar</button>
                </div>
            </div>
            </div>
        </form>
    </main>
    <script src="../js/cadastro.js"></script>
    <script src="../js/fotoPerfil.js"></script>
    <footer>
        <hr>
        <div class="footer-content">
            <img src="../assets/images/imagem_logo.png" alt="">
            <p>&copy;2026 FitZone Studio. Todos os direitos reservados. </p>
            <a>Suporte</a>
        </div>
    </footer>
</body>

</html>
