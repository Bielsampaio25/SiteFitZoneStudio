<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Cadastro Aluno</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="title">FitZone Studio</h1>
            <ul class="navlist">
                <li><a href="home.html">Inicio</a></li>
                <li>Dashboard</li>
                <li>Sobre Nós</li>
                <li>Conta</li>
                <img src="../image/images.jpg" alt="Foto de perfil">
            </ul>
        </nav>
    </header>

    <main>
        <form>
+            <div class="container">

                <h1>Cadastro</h1>

                <div class="formulario">

                    <div class="dadosPessoais">

                        <div class="campo">
                            <label for="name">Nome Completo</label>
                            <input type="text" name="name" id="name" placeholder="Digite seu nome completo">
                        </div>

                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" name="cpf" id="cpf" placeholder="Digite seu cpf">
                        </div>

                        <div class="campo">
                            <label for="dtaNascimento">Data de Nascimento</label>
                            <input type="date" name="dtaNascimento" id="dtaNascimento">
                        </div>

                        <div class="campo">
                            <label for="sexo">Sexo</label>
                            <select name="sexo" id="sexo">
                                <option value="0">Selecione uma opção</option>
                                <option value="1">Masculino</option>
                                <option value="2">Feminino</option>
                                <option value="3">Não-Binário</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email" placeholder="Digite seu email">
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input type="tel" name="telefone" id="telefone" placeholder="Digite seu telefone">
                        </div>

                        <div class="campo">
                            <label for="users">Nome de Usuário</label>
                            <input type="text" name="users" id="users" placeholder="Crie seu nome de usuário">
                        </div>

                        <div class="campo">
                            <label for="password">Senha</label>
                            <input type="password" name="password" id="password" placeholder="Crie sua senha">
                        </div>

                    </div>

                    <div class="endereco">

                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input type="text" name="cep" id="cep" placeholder="Informe seu cep">
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <input type="text" name="estado" id="estado" placeholder="Informe seu estado">
                        </div>

                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input type="text" name="cidade" id="cidade" placeholder="Informe sua cidade">
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro</label>
                            <input type="text" name="bairro" id="bairro" placeholder="Informe seu bairro">
                        </div>

                        <div class="campo">
                            <label for="endereco">Endereço</label>
                            <input type="text" name="endereco" id="endereco" placeholder="Informe seu endereço">
                        </div>

                        <div class="campo">
                            <label for="numero">Número</label>
                            <input type="text" name="numero" id="numero" placeholder="Informe seu número">
                        </div>

                        <div class="campo">
                            <label for="complemento">Complemento</label>
                            <input type="text" name="complemento" id="complemento" placeholder="Informe o complemento">
                        </div>

                    </div>

                </div>

                <div class="btnCadastro">
                    <button type="button" onclick="verificarInput(), verificarCpf(), verificarSelect()">Cadastrar</button>
                    <p id="mensagem"></p>
                </div>

            </div>
        </form>
    </main>
       <script src="../js/cadastro.js"></script>
    <footer>
        <p>Endereço: Rua das Palmeiras, 245 - Pituba, Salvador</p>
        <p>Telefone: +55 (71) 99845-2713</p>
        <p>Email: contato@fitzonestudio.com.br</p>
        <p>Instagram: @fitzonestudio.ba</p>
    </footer>
</body>

</html>
